{
  "name": "Temporary isolated TTT runtime validation",
  "on": { "workflow_dispatch": {} },
  "jobs": {
    "isolated-runtime": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 8,
      "permissions": { "actions": "read", "contents": "read" },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": { "sparse-checkout": ".github/scripts" }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": { "node-version": "20.20.2" }
        },
        {
          "name": "Download the exact successful development build",
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "node-app",
            "path": "isolated-artifact",
            "run-id": 37656130344,
            "github-token": "${{ github.token }}"
          }
        },
        {
          "name": "Exercise real server with isolated source and storage",
          "run": "node .github/scripts/ttt-isolated-runtime.mjs"
        }
      ]
    }
  }
}